name: CD Pipeline - Garantie fichiers frais

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout AVEC tous les fichiers
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # ⭐ Récupère TOUTE l'historique
        ref: ${{ github.ref }}  # ⭐ La branche exacte
    
    - name: 📋 VÉRIFICATION CRITIQUE des fichiers
      run: |
        echo "=== VÉRIFICATION CRITIQUE ==="
        echo ""
        
        # 1. Vérifier qu'on a les bons fichiers
        echo "1. 📁 Fichiers présents :"
        ls -la *.html *.css *.js *.md Dockerfile 2>/dev/null || true
        echo ""
        
        # 2. Vérifier index.html
        echo "2. 🔍 Analyse de index.html :"
        if [ ! -f "index.html" ]; then
          echo "❌ CRITIQUE : index.html manquant !"
          exit 1
        fi
        
        HTML_CONTENT=$(cat index.html)
        HTML_SIZE=${#HTML_CONTENT}
        echo "   ✅ Taille : $HTML_SIZE caractères"
        
        if [ $HTML_SIZE -lt 100 ]; then
          echo "   ⚠️  Attention : index.html semble trop petit"
        fi
        
        # 3. Vérifier la date des fichiers
        echo ""
        echo "3. 📅 Dernières modifications :"
        for file in index.html styles.css app.js; do
          if [ -f "$file" ]; then
            MOD_TIME=$(stat -c %y "$file" 2>/dev/null || stat -f "%Sm" "$file" 2>/dev/null)
            echo "   📄 $file : $MOD_TIME"
          fi
        done
        
        echo ""
        echo "✅ TOUTES LES VÉRIFICATIONS PASSÉES"
        echo "🚀 Prêt pour le build Docker"
    
    - name: 🔐 Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: 🐳 Build ABSOLUMENT FRAIS
      run: |
        echo "=== BUILD DOCKER ULTRA-FRAIS ==="
        echo ""
        
        DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"
        IMAGE_NAME="$DOCKER_USER/tp-devops-app"
        
        echo "🔄 Commit actuel : ${{ github.sha }}"
        echo "📅 Date du build : $(date)"
        echo ""
        
        # CONSTRUCTION SANS AUCUN CACHE
        echo "🏗️ Lancement du build COMPLET..."
        docker build \
          --no-cache \
          --pull \
          --build-arg GIT_COMMIT=${{ github.sha }} \
          --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
          -t $IMAGE_NAME:latest \
          -t $IMAGE_NAME:commit-${{ github.sha }} \
          .
        
        echo ""
        echo "✅ BUILD TERMINÉ"
        
        # AFFICHER les infos de la NOUVELLE image
        echo ""
        echo "📊 NOUVELLE IMAGE :"
        docker images $IMAGE_NAME:latest --format "table {{.Repository}}\t{{.Tag}}\t{{.CreatedAt}}\t{{.Size}}"
    
    - name: 🔬 INSPECTION de l'image fraîche
      run: |
        echo "=== INSPECTION DE L'IMAGE ==="
        echo ""
        
        IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/tp-devops-app"
        
        # 1. Lister les fichiers dans l'image
        echo "1. 📁 Fichiers dans /usr/share/nginx/html :"
        docker run --rm $IMAGE_NAME:latest find /usr/share/nginx/html -type f | while read file; do
          SIZE=$(docker run --rm $IMAGE_NAME:latest stat -c%s "$file" 2>/dev/null || echo "?")
          echo "   📄 $file ($SIZE bytes)"
        done
        
        # 2. Vérifier le contenu de index.html
        echo ""
        echo "2. 📄 Contenu de index.html dans l'image :"
        docker run --rm $IMAGE_NAME:latest head -20 /usr/share/nginx/html/index.html
        
        # 3. Vérifier les métadonnées
        echo ""
        echo "3. 🏷️ Métadonnées de l'image :"
        docker inspect $IMAGE_NAME:latest --format='{{.Config.Labels}}'
        
        echo ""
        echo "✅ INSPECTION TERMINÉE - Image VALIDE"
    
    - name: 📤 Push Docker Hub
      run: |
        echo "=== PUBLICATION ==="
        echo ""
        
        IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/tp-devops-app"
        
        echo "📤 Envoi des images..."
        docker push $IMAGE_NAME:latest
        docker push $IMAGE_NAME:commit-${{ github.sha }}
        
        echo ""
        echo "🎉 PUBLICATION RÉUSSIE !"
        echo "🆕 Nouvelle image : $IMAGE_NAME:latest"
        echo "🔗 https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/tp-devops-app"
        echo ""
        echo "💡 Pour tester : docker run -p 8080:80 $IMAGE_NAME:latest"