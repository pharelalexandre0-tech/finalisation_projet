name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🔐 Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: 🐳 Build & Push
      run: |
        IMAGE="${{ secrets.DOCKER_USERNAME }}/tp-devops-app"
        docker build -t $IMAGE:latest .
        docker push $IMAGE:latest
        echo "✅ Image publiée"
    
    - name: ✅ Notification GitHub Status - DOCKER PUBLISH
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'success',
            context: 'CD/Docker Publish',
            description: 'Image publiée sur Docker Hub',
            target_url: `https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/tp-devops-app`
          });
  
  deploy:
    needs: docker-publish
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      pages: write
      id-token: write
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🛠️ Build site
      run: |
        mkdir -p ./public
        [ -f "index.html" ] && cp index.html ./public/ || echo "Création index.html"
        touch ./public/.nojekyll
    
    - name: 📤 Upload
      uses: actions/upload-pages-artifact@v3
      with:
        name: github-pages
        path: ./public/
    
    - name: 🚀 Deploy
      id: deployment
      uses: actions/deploy-pages@v4
    
    - name: ✅ Notification GitHub Status - DEPLOYMENT
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'success',
            context: 'CD/GitHub Pages',
            description: 'Site déployé sur GitHub Pages',
            target_url: '${{ steps.deployment.outputs.page_url }}'
          });
    
    - name: 📢 Notification finale
      run: |
        echo "## 🎯 DÉPLOIEMENT COMPLET" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**✅ Toutes les notifications GitHub Status ont été envoyées :**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "1. ✅ CI/Tests - Tests unitaires" >> $GITHUB_STEP_SUMMARY
        echo "2. ✅ CI/Docker Build - Construction Docker" >> $GITHUB_STEP_SUMMARY
        echo "3. ✅ CD/Docker Publish - Publication Docker Hub" >> $GITHUB_STEP_SUMMARY
        echo "4. ✅ CD/GitHub Pages - Déploiement site web" >> $GITHUB_STEP_SUMMARY