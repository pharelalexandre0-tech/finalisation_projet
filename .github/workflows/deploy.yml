name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
    
    - name: 📦 Préparation des fichiers
      run: |
        echo "🔨 Préparation du build..."
        
        # Créer le répertoire de build
        mkdir -p ./build
        
        # Copier tous les fichiers nécessaires
        cp index.html ./build/
        cp styles.css ./build/
        cp app.js ./build/
        
        # Optionnel: Créer un fichier .nojekyll pour désactiver Jekyll
        touch ./build/.nojekyll
        
        # Créer un fichier de version
        echo "Build: ${{ github.sha }}" > ./build/version.txt
        echo "Date: $(date)" >> ./build/version.txt
        echo "Repository: ${{ github.repository }}" >> ./build/version.txt
        
        echo "✅ Build préparé"
    
    - name: 📤 Upload des fichiers pour GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        name: github-pages
        path: ./build/
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    # ⭐ CORRECTION ICI : Utiliser ${{ }} au lieu de ${( )}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}  # ⭐ Correction
    
    permissions:
      pages: write
      id-token: write
    
    steps:
    - name: 🚀 Déployer sur GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    
    - name: ✅ Afficher l'URL
      run: |
        echo "🎉 Déploiement réussi !"
        echo ""
        echo "Votre site est disponible à :"
        echo "👉 ${{ steps.deployment.outputs.page_url }}"