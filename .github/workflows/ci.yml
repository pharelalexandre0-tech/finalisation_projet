name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
    
    - name: ⚙️ Configuration Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: 📦 Installation des dépendances
      run: |
        npm init -y
        npm install --save-dev jest
    
    - name: 🧪 Exécution des tests
      run: |
        echo "🚀 Lancement des tests..."
        # Créer un fichier HTML temporaire pour les tests
        cat > test.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head><title>Mon Application Web</title></head>
        <body><div class="container"><section></section><section></section></div></body>
        </html>
        EOF
        
        # Copier le fichier de test
        cp tests/test.js test-runner.js
        
        # Ajouter un script pour exécuter les tests
        cat >> test-runner.js << 'EOF'
        const fs = require('fs');
        const { JSDOM } = require('jsdom');
        
        const html = fs.readFileSync('test.html', 'utf8');
        const dom = new JSDOM(html);
        global.document = dom.window.document;
        global.window = dom.window;
        
        require('./test-runner');
        EOF
        
        # Installer jsdom pour les tests
        npm install jsdom
        
        # Exécuter les tests
        if node test-runner.js; then
          echo "✅ Tous les tests sont passés"
        else
          echo "❌ Certains tests ont échoué"
          exit 1
        fi
    
    - name: 📊 Génération de rapport
      run: |
        echo "📈 Rapport de build généré"
        echo "Statut: SUCCÈS" > build-report.txt
        echo "Date: $(date)" >> build-report.txt
        echo "Branche: ${{ github.ref }}" >> build-report.txt
        echo "Commit: ${{ github.sha }}" >> build-report.txt
    
    - name: 📦 Artifact - Rapport de build
      uses: actions/upload-artifact@v4
      with:
        name: build-report
        path: build-report.txt
    
    - name: ✅ Status GitHub
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'success',
            context: 'CI Tests',
            description: 'Tous les tests sont passés avec succès',
            target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          })
  
  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
    
    - name: 🐳 Build Docker
      run: |
        echo "🔨 Construction de l'image Docker..."
        docker build -t my-web-app:ci-${{ github.sha }} .
        echo "✅ Build Docker terminé"
    
    - name: 📦 Artifact - Fichiers de build
      uses: actions/upload-artifact@v4
      with:
        name: web-app-files
        path: |
          index.html
          styles.css
          app.js