name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  statuses: write  # Pour créer des statuts de commit

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
    
    - name: ⚙️ Configuration Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: 🧪 Tests simples
      run: |
        echo "🚀 Début des tests..."
        
        # Test 1: Vérification des fichiers essentiels
        echo "📁 Vérification des fichiers..."
        required_files=("index.html" "styles.css" "app.js" "Dockerfile")
        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file présent"
          else
            echo "❌ $file manquant"
            exit 1
          fi
        done
        
        # Test 2: Vérification du contenu HTML
        echo "🔍 Vérification du HTML..."
        if grep -q "DOCTYPE html" index.html; then
          echo "✅ Structure HTML valide"
        else
          echo "❌ Structure HTML invalide"
          exit 1
        fi
        
        # Test 3: Vérification Dockerfile
        echo "🐳 Vérification Dockerfile..."
        if grep -q "FROM nginx" Dockerfile; then
          echo "✅ Dockerfile utilise nginx"
        else
          echo "⚠️ Dockerfile n'utilise pas nginx"
        fi
        
        echo "🎉 Tous les tests sont passés!"
    
    - name: ✅ Mise à jour du statut (si permissions disponibles)
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          // Cette action utilise automatiquement le GITHUB_TOKEN fourni par GitHub
          // Pas besoin de le spécifier comme secret
          try {
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'CI Tests',
              description: 'Tests passés avec succès',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
          } catch (error) {
            // Si les permissions ne sont pas suffisantes, on continue quand même
            console.log('Note: Impossible de mettre à jour le statut GitHub');
            console.log('Pour activer cette fonctionnalité, configurez les permissions dans Settings > Actions');
          }