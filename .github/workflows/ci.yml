name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🧪 Tests
      run: |
        echo "🧪 Tests unitaires..."
        [ -f "index.html" ] || exit 1
        [ -f "Dockerfile" ] || exit 1
        echo "✅ Tests passés"
    
    - name: 🐳 Build Docker
      run: |
        echo "🔨 Build Docker image..."
        docker build -t tp-devops-app:ci-${{ github.sha }} .
        echo "✅ Docker image built"
    
    - name: 📊 Rapport CI
      run: |
        echo "## 📋 CI REPORT" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ✅ SUCCESS" >> $GITHUB_STEP_SUMMARY
        echo "**Tests:** Passed" >> $GITHUB_STEP_SUMMARY
        echo "**Docker:** Image built" >> $GITHUB_STEP_SUMMARY
  
  # Badge de statut CI
  ci-badge:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📛 Update CI Badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_TOKEN }}
        gistID: YOUR_GIST_ID
        filename: ci-status.json
        label: CI
        message: ${{ needs.test.result }}
        color: ${{ needs.test.result == 'success' && 'green' || 'red' }}