name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🔍 Tests
      run: |
        echo "🧪 Tests en cours..."
        [ -f "index.html" ] && echo "✅ index.html OK" || exit 1
        [ -f "Dockerfile" ] && echo "✅ Dockerfile OK" || exit 1
        echo "🎉 Tests réussis"
    
    - name: ✅ Notification GitHub Status - TESTS
      uses: actions/github-script@v7
      with:
        script: |
          try {
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'CI/Tests',
              description: 'Tests unitaires passés avec succès',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            console.log('✅ Notification GitHub Status envoyée (Tests)');
          } catch (error) {
            console.log('⚠️ Impossible d\'envoyer la notification GitHub Status');
          }
  
  build-docker:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🐳 Build Docker
      run: |
        echo "🔨 Construction Docker..."
        docker build -t test-app:${{ github.sha }} .
        echo "✅ Docker build OK"
    
    - name: ✅ Notification GitHub Status - DOCKER BUILD
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'success',
            context: 'CI/Docker Build',
            description: 'Image Docker construite avec succès',
            target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          });