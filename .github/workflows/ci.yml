name: CI Pipeline Complete

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
    
    - name: 🧪 Tests
      run: |
        echo "🧪 Exécution des tests..."
        # Tests basiques
        [ -f "index.html" ] || exit 1
        [ -f "Dockerfile" ] || exit 1
        echo "✅ Tests passés"
    
    - name: 📦 Préparer les fichiers pour GitHub Pages
      run: |
        echo "📁 Préparation des fichiers..."
        mkdir -p ./_site
        
        # Copier les fichiers
        cp index.html ./_site/ 2>/dev/null || echo "Création index.html par défaut"
        
        if [ ! -f "./_site/index.html" ]; then
          cat > ./_site/index.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <title>TP DevOps</title>
</head>
<body>
    <h1>✅ CI/CD Pipeline</h1>
</body>
</html>
EOF
        fi
        
        cp styles.css ./_site/ 2>/dev/null || true
        cp app.js ./_site/ 2>/dev/null || true
        touch ./_site/.nojekyll
        
        echo "Fichiers préparés dans ./_site"
    
    - name: 📤 Upload artefact pour GitHub Pages
      uses: actions/upload-artifact@v4
      with:
        name: github-pages
        path: ./_site/
        retention-days: 1
  
  build-docker:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
    
    - name: 🐳 Build Docker (test)
      run: |
        echo "🔨 Build Docker..."
        docker build -t test-app:${{ github.sha }} .
        echo "✅ Build réussi"
  
  deploy:
    needs: [test, build-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      pages: write
      id-token: write
    
    steps:
    - name: 📥 Télécharger l'artefact
      uses: actions/download-artifact@v4
      with:
        name: github-pages
        path: ./_site
    
    - name: 📤 Upload pour déploiement
      uses: actions/upload-pages-artifact@v3
      with:
        name: github-pages
        path: ./_site
    
    - name: 🚀 Déployer
      id: deployment
      uses: actions/deploy-pages@v4
    
    - name: ✅ Rapport
      run: |
        echo "✅ Site déployé: ${{ steps.deployment.outputs.page_url }}"