name: Publish Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
    
    - name: 🔐 Login à Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: 🐳 Build et Push l'image
      run: |
        echo "🔨 Construction de l'image Docker..."
        
        # Variables
        IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/tp-devops-app"
        
        # Raccourcir le SHA (premiers 7 caractères)
        SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
        
        # Construire avec plusieurs tags
        docker build -t $IMAGE_NAME:latest \
                     -t $IMAGE_NAME:${{ github.sha }} \
                     -t $IMAGE_NAME:$SHA_SHORT \
                     -t $IMAGE_NAME:${{ github.ref_name }} .
        
        echo "✅ Images construites :"
        echo "  - $IMAGE_NAME:latest"
        echo "  - $IMAGE_NAME:${{ github.sha }}"
        echo "  - $IMAGE_NAME:$SHA_SHORT"
        echo "  - $IMAGE_NAME:${{ github.ref_name }}"
        
        # Pousser toutes les images
        echo "📤 Pushing images to Docker Hub..."
        docker push $IMAGE_NAME:latest
        docker push $IMAGE_NAME:${{ github.sha }}
        docker push $IMAGE_NAME:$SHA_SHORT
        docker push $IMAGE_NAME:${{ github.ref_name }}
        
        echo "🎉 Images poussées avec succès !"
    
    - name: 📝 Rapport de publication
      run: |
        # Calculer SHA court pour l'affichage
        SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
        
        echo "## 🐳 DOCKER IMAGE PUBLISHED" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**✅ IMAGES DISPONIBLES SUR DOCKER HUB**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📦 Images :**" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKER_USERNAME }}/tp-devops-app:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKER_USERNAME }}/tp-devops-app:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKER_USERNAME }}/tp-devops-app:$SHA_SHORT\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKER_USERNAME }}/tp-devops-app:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🔗 Liens :**" >> $GITHUB_STEP_SUMMARY
        echo "- [Docker Hub Repository](https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/tp-devops-app)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🚀 Pour tester :**" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "# Pull l'image" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ secrets.DOCKER_USERNAME }}/tp-devops-app:latest" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# Lancer le conteneur" >> $GITHUB_STEP_SUMMARY
        echo "docker run -p 8080:80 ${{ secrets.DOCKER_USERNAME }}/tp-devops-app" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY