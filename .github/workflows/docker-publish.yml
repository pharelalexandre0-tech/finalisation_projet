name: Publish Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout du code
      uses: actions/checkout@v4
    
    - name: 🔐 Login à Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: 🐳 Build et Push
      run: |
        echo "🔨 Construction de l'image Docker..."
        
        # Variables
        DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"
        IMAGE_NAME="$DOCKER_USER/tp-devops-app"
        
        echo "Image: $IMAGE_NAME"
        echo "SHA: ${{ github.sha }}"
        
        # Build avec tags
        docker build -t $IMAGE_NAME:latest \
                     -t $IMAGE_NAME:${{ github.sha }} .
        
        echo "✅ Images construites"
        
        # Push
        echo "📤 Envoi vers Docker Hub..."
        docker push $IMAGE_NAME:latest
        docker push $IMAGE_NAME:${{ github.sha }}
        
        echo "🎉 Images publiées !"
    
    - name: 📢 Rapport
      run: |
        echo "## 🐳 IMAGE DOCKER PUBLIÉE" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**✅ SUCCÈS**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Images disponibles sur Docker Hub :**" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKER_USERNAME }}/tp-devops-app:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ secrets.DOCKER_USERNAME }}/tp-devops-app:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Lien :** https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/tp-devops-app" >> $GITHUB_STEP_SUMMARY